{% load static %}<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ CRM_NOMBRE }}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; background: var(--bg); }
    #pantalla { flex: 1; width: 100%; border: 0; display: block; background: var(--bg); }
    #tel { flex: none; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 14px;
           background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 13px; position: relative; z-index: 5; }
    #tel .estado { display: flex; align-items: center; gap: 7px; color: var(--text2); white-space: nowrap; }
    #tel .estado .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; flex: none; }
    #tel[data-estado="listo"] .estado .dot { background: #22C97A; }
    #tel[data-estado="conectando"] .estado .dot { background: #F59E0B; animation: titila 1s infinite; }
    #tel[data-estado="error"] .estado .dot { background: #EF4444; }
    #tel .llamada { display: none; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    #tel.en-llamada .llamada, #tel.sonando .llamada { display: flex; }
    #tel.en-llamada, #tel.sonando { background: color-mix(in srgb, var(--bg2) 75%, #22C97A 25%); }
    #tel.sonando { animation: sonar 1.2s ease-in-out infinite; }
    #tel .quien { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #tel .quien b { color: var(--text); }
    #tel .reloj { font-variant-numeric: tabular-nums; color: var(--text2); }
    #tel .acciones { display: flex; gap: 6px; margin-left: auto; }
    #tel .btn { --bs-btn-padding-y: .2rem; --bs-btn-padding-x: .55rem; font-size: 13px; }
    #tel .aviso { color: var(--text2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #tel.en-llamada .aviso, #tel.sonando .aviso { display: none; }
    #teclado { position: absolute; top: 46px; right: 14px; background: var(--bg2); border: 1px solid var(--border);
               border-radius: 10px; padding: 10px; display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; }
    #teclado[hidden] { display: none; }
    @keyframes titila { 50% { opacity: .3; } }
    @keyframes sonar { 50% { background: color-mix(in srgb, var(--bg2) 55%, #22C97A 45%); } }
    @media (prefers-reduced-motion: reduce) { #tel.sonando, #tel .estado .dot { animation: none !important; } }
  </style>
</head>
<body>
<div id="tel" data-estado="conectando" role="region" aria-label="Teléfono">
  <div class="estado"><span class="dot"></span><i class="bi bi-headset"></i> <span class="txt">Conectando teléfono…</span></div>
  <div class="aviso"></div>
  <div class="llamada" aria-live="polite">
    <div class="quien"></div>
    <span class="reloj"></span>
    <div class="acciones">
      <a class="btn btn-outline-secondary ver-ficha" href="#" title="Abrir la ficha" hidden><i class="bi bi-person-vcard"></i> Ficha</a>
      <button class="btn btn-success atender" hidden><i class="bi bi-telephone-inbound"></i> Atender</button>
      <button class="btn btn-outline-secondary silenciar" hidden title="Silenciar micrófono"><i class="bi bi-mic-mute"></i></button>
      <button class="btn btn-outline-secondary espera" hidden title="Poner en espera"><i class="bi bi-pause-circle"></i></button>
      <button class="btn btn-outline-secondary abrir-teclado" hidden title="Teclado"><i class="bi bi-grid-3x3-gap"></i></button>
      <button class="btn btn-danger cortar"><i class="bi bi-telephone-x"></i> Cortar</button>
    </div>
  </div>
  <button class="btn btn-sm btn-outline-secondary microfono" hidden><i class="bi bi-mic"></i> Permitir micrófono</button>
  <div id="teclado" hidden>{% for t in "123456789*0#" %}<button type="button" class="btn btn-outline-secondary" data-tono="{{ t }}">{{ t }}</button>{% endfor %}</div>
</div>
<input type="hidden" id="csrf" value="{{ csrf_token }}">
<iframe id="pantalla" src="{{ destino }}" title="CRM"></iframe>
<audio id="audioRemoto" autoplay></audio>
<script src="{% static 'vendor/jssip-3.13.8.min.js' %}"></script>
<script src="{% static 'js/telefono.js' %}"></script>
</body>
</html>
