{% load static %}<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} · {{ CRM_NOMBRE }}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/main.css' %}"><link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<script>if (window.top !== window) window.top.location.replace(location.href);  // nunca dentro del marco del teléfono</script>
<div class="login-page"><div class="login-card">
  <div class="login-brand"><div class="logo-mark">{{ CRM_NOMBRE|slice:":1" }}V</div><div><div class="logo-label">{{ CRM_NOMBRE }}</div><div class="small muted">{{ CRM_SUBTITULO }}</div></div></div>
  {% if messages %}{% for m in messages %}<div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} py-2 small">{{ m }}</div>{% endfor %}{% endif %}
  {% block auth %}{% endblock %}
</div></div>
</body>
</html>
