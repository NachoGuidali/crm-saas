{% extends "base.html" %}
{% block title %}Notificaciones{% endblock %}
{% block content %}
<div class="page-head"><h1><i class="bi bi-bell"></i> Notificaciones</h1></div>
<div class="card">{% for n in page %}<a href="{{ n.url|default:'#' }}" class="d-flex gap-3 px-3 py-2 border-bottom text-decoration-none {% if n.leida %}opacity-50{% endif %}" style="color:var(--text)">
  <i class="bi bi-{{ n.icono }} mt-1"></i><div class="flex-grow-1"><div class="fw-semibold small">{{ n.titulo }}</div><div class="small muted">{{ n.cuerpo }}</div></div><span class="small muted text-nowrap">{{ n.created_at|date:"d/m H:i" }}</span></a>
{% empty %}<div class="p-4 text-center muted">Sin notificaciones.</div>{% endfor %}</div>
{% include "_paginacion.html" %}
{% endblock %}
