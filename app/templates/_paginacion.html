{% load crm_extras %}{% if page.has_other_pages %}
<nav class="mt-3 d-flex justify-content-between align-items-center">
  <span class="small muted">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  <ul class="pagination pagination-sm mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% qs_con page=1 %}">«</a></li><li class="page-item"><a class="page-link" href="?{% qs_con page=page.previous_page_number %}">‹</a></li>{% endif %}
    <li class="page-item active"><span class="page-link">{{ page.number }}</span></li>
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% qs_con page=page.next_page_number %}">›</a></li><li class="page-item"><a class="page-link" href="?{% qs_con page=page.paginator.num_pages %}">»</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
