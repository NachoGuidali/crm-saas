{% extends "users/_auth_base.html" %}
{% block title %}Panel de la plataforma{% endblock %}
{% block auth %}
<p class="small muted mb-3">Panel de la plataforma</p>
<form method="post" novalidate>{% csrf_token %}
  {% if form.non_field_errors %}<div class="alert alert-danger py-2 small">{{ form.non_field_errors|join:" " }}</div>{% endif %}
  <div class="mb-3"><label class="form-label">Usuario</label><input name="username" class="form-control" autofocus required></div>
  <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" name="password" class="form-control" required></div>
  <button class="btn btn-primary w-100">Ingresar</button>
</form>
{% endblock %}
