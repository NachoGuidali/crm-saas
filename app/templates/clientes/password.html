{% extends "clientes/_base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Cambiar contraseña</h1>
<div class="row"><div class="col-md-6 col-lg-5">
  <div class="card card-body">
    <form method="post" novalidate>{% csrf_token %}
      {% for campo in form %}
        {% include "clientes/_campo.html" with f=campo %}
      {% endfor %}
      <button class="btn btn-primary">Guardar</button>
      <a href="{% url 'panel:clientes' %}" class="btn btn-link">Cancelar</a>
    </form>
  </div>
</div></div>
{% endblock %}
