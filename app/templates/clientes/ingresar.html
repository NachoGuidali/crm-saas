{% extends "users/_auth_base.html" %}
{% block title %}Ingresar{% endblock %}
{% block auth %}
<form method="post" novalidate>{% csrf_token %}
  <div class="mb-3"><label class="form-label">{{ form.empresa.label }}</label>
    <div class="input-group">{{ form.empresa }}<span class="input-group-text small">.{{ SAAS_DOMINIO }}</span></div>
    {% for e in form.empresa.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
  </div>
  <button class="btn btn-primary w-100">Continuar</button>
</form>
{% endblock %}
