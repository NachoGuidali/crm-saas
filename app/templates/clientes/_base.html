{% load static %}<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Panel{% endblock %} · {{ CRM_NOMBRE }}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/main.css' %}"><link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<nav class="navbar navbar-expand border-bottom px-4 py-2">
  <a class="navbar-brand fw-semibold" href="{% url 'panel:clientes' %}"><i class="bi bi-grid-3x3-gap me-1"></i> {{ CRM_NOMBRE }} · Plataforma</a>
  <div class="navbar-nav me-auto">
    <a class="nav-link {% if request.resolver_match.url_name|slice:':7' == 'cliente' %}active{% endif %}" href="{% url 'panel:clientes' %}">Clientes</a>
    <a class="nav-link {% if request.resolver_match.url_name == 'pagos' %}active{% endif %}" href="{% url 'panel:pagos' %}">Pagos</a>
    <a class="nav-link {% if request.resolver_match.url_name|slice:':4' == 'plan' %}active{% endif %}" href="{% url 'panel:planes' %}">Planes</a>
    <a class="nav-link {% if request.resolver_match.url_name == 'auditoria' %}active{% endif %}" href="{% url 'panel:auditoria' %}">Auditoría</a>
  </div>
  <div class="navbar-nav align-items-center">
    <a class="nav-link {% if request.resolver_match.url_name == 'password' %}active{% endif %}" href="{% url 'panel:password' %}"><i class="bi bi-person-circle me-1"></i>{{ request.user.get_username }}</a>
    <form method="post" action="{% url 'panel:logout' %}" class="ms-2">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Salir</button></form>
  </div>
</nav>
<main class="container py-4" style="max-width:1100px">
  {% for m in messages %}<div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} py-2 small">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
