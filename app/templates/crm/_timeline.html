<form data-ajax data-reset action="{{ nota_url }}" class="mb-3" id="formNota">
  <textarea name="texto" rows="2" class="form-control mb-2" placeholder="Escribí una nota… (usá @usuario para mencionar a alguien)" required></textarea>
  <div class="text-end"><button class="btn btn-sm btn-outline-warning"><i class="bi bi-sticky"></i> Guardar nota</button></div>
</form>
<div class="d-flex gap-1 flex-wrap mb-2" id="tlFiltros">
  {% for k, l in filtros_actividad %}<button type="button" class="btn btn-xs {% if forloop.first %}btn-primary{% else %}btn-outline-secondary{% endif %}" data-f="{{ k }}">{{ l }}</button>{% endfor %}
</div>
<div class="timeline" id="timeline">
  {% for a in actividades %}{% include "crm/_actividad.html" %}{% empty %}<div class="muted small">Sin actividad todavía.</div>{% endfor %}
</div>
<script>
(function () {
  const tl = document.getElementById('timeline');
  document.querySelectorAll('#tlFiltros [data-f]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#tlFiltros [data-f]').forEach(x => x.className = 'btn btn-xs btn-outline-secondary');
    b.className = 'btn btn-xs btn-primary';
    const tipos = b.dataset.f ? b.dataset.f.split(',') : null;
    tl.querySelectorAll('.tl-item').forEach(it => { it.style.display = !tipos || tipos.includes(it.dataset.tipo) ? '' : 'none'; });
  }));
})();
document.getElementById('formNota').addEventListener('crm:ok', e => {
  if (e.detail.html) document.getElementById('timeline').insertAdjacentHTML('afterbegin', e.detail.html);
});
</script>
