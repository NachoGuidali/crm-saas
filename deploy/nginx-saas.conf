# /etc/nginx/sites-available/crm-saas
# Un solo bloque para el dominio principal (panel) y todos los subdominios de clientes.
#
# DNS: registro A para supregcrm.com y para *.supregcrm.com → IP del servidor.
# Certificado comodín (necesita desafío DNS; ejemplo con Cloudflare):
#   apt install python3-certbot-dns-cloudflare
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.cloudflare.ini \
#       -d supregcrm.com -d '*.supregcrm.com'
# Después: ln -s ../sites-available/crm-saas /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx

upstream crm_saas {
    server 127.0.0.1:8000;   # = WEB_PORT del .env
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name supregcrm.com *.supregcrm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name supregcrm.com *.supregcrm.com;

    ssl_certificate     /etc/letsencrypt/live/supregcrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supregcrm.com/privkey.pem;

    client_max_body_size 25m;          # adjuntos de WhatsApp (16 MB) e importaciones de Excel
    proxy_read_timeout 90s;

    location / {
        proxy_pass http://crm_saas;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;   # imprescindible: con el Host se sabe de qué cliente es el request
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
