# /etc/nginx/sites-available/crmmkt.supregsolutions.com
# Después: ln -s ../sites-available/crmmkt.supregsolutions.com /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#          certbot --nginx -d crmmkt.supregsolutions.com   (agrega el bloque 443 y la redirección a HTTPS)

upstream crmmkt {
    server 127.0.0.1:8010;   # = WEB_PORT del .env
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name crmmkt.supregsolutions.com;

    client_max_body_size 25m;          # adjuntos de WhatsApp (16 MB) e importaciones de Excel
    proxy_read_timeout 90s;

    location / {
        proxy_pass http://crmmkt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
